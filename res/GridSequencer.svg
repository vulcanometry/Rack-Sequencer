<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="233.68mm" height="128.5mm" viewBox="0 0 233.68 128.5">
  <!-- Base -->
  <rect x="0" y="0" width="233.68" height="128.5" fill="#1d2027"/>
  <rect x="0" y="0" width="233.68" height="2.2" fill="#2c313b"/>
  <rect x="0" y="126.3" width="233.68" height="2.2" fill="#2c313b"/>

  <!-- Left control column -->
  <!-- Steppers: sequence / scale / root / gate; tempo knob and display -->
  <rect x="2.4" y="3.4" width="28.2" height="47.4" rx="1.2" fill="#252a33"/>
  <!-- Transport / clock inputs -->
  <rect x="2.4" y="51.6" width="28.2" height="44" rx="1.2" fill="#2e3440"/>
  <!-- Output pad: clock / end of song / run / reset -->
  <rect x="2.4" y="96.6" width="28.2" height="29.2" rx="1.2" fill="#14161b"/>

  <!-- Display bezel (info, grid, song) -->
  <rect x="33.8" y="2.6" width="131.4" height="109.8" rx="1.2" fill="#0b0c0f" stroke="#3a404c" stroke-width="0.35"/>

  <!-- Scroll button strip -->
  <rect x="167.8" y="13" width="5.6" height="88" rx="1" fill="#252a33"/>

  <!-- Function button groups: song / pattern / track -->
  <rect x="35" y="112.6" width="75.2" height="13.2" rx="1.2" fill="#252a33"/>
  <rect x="112.7" y="112.6" width="28.2" height="13.2" rx="1.2" fill="#252a33"/>
  <rect x="143.4" y="112.6" width="28.2" height="13.2" rx="1.2" fill="#252a33"/>

  <!-- Track section -->
  <rect x="175" y="4.2" width="57.2" height="113" rx="1.2" fill="#252a33"/>
  <!-- Output pad: gate / CV / MOD -->
  <rect x="201" y="4.8" width="30.8" height="111.8" rx="1" fill="#14161b"/>
  <g stroke="#3a404c" stroke-width="0.25">
    <line x1="176" y1="25.5" x2="231.2" y2="25.5"/>
    <line x1="176" y1="38.5" x2="231.2" y2="38.5"/>
    <line x1="176" y1="51.5" x2="231.2" y2="51.5"/>
    <line x1="176" y1="64.5" x2="231.2" y2="64.5"/>
    <line x1="176" y1="77.5" x2="231.2" y2="77.5"/>
    <line x1="176" y1="90.5" x2="231.2" y2="90.5"/>
    <line x1="176" y1="103.5" x2="231.2" y2="103.5"/>
  </g>
</svg>
